
<!DOCTYPE html>
<html>
<head>
    <title>Issue Book</title>

    <style>
        body {
            background: #f4f1fa;
            font-family: Arial;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            color: #4b267d;
            text-align: center;
        }

        select {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4b267d;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Issue Book</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Select Book</label>

        <select name="book" required>
            <option value="">Choose Book</option>

            {% for book in books %}
            <option value="{{ book.id }}">
                {{ book.book_name }} ({{ book.quantity }} available)
            </option>
            {% endfor %}
        </select>

        <label>Select Member</label>

        <select name="member" required>
            <option value="">Choose Member</option>

            {% for member in members %}
            <option value="{{ member.id }}">
                {{ member.name }}
            </option>
            {% endfor %}
        </select>

        <button type="submit">Issue Book</button>

    </form>

</div>

</body>
</html>
