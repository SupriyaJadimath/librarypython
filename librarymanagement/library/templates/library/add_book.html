
<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f1fa;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #4b267d;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4b267d;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Add New Book</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="book_name"
        placeholder="Book Name" required>

        <input type="text" name="author"
        placeholder="Author" required>

        <input type="text" name="category"
        placeholder="Category" required>

        <input type="number" name="quantity"
        placeholder="Quantity" min="0" required>

        <input type="number" name="price"
        placeholder="Price" min="0" required>

        <button type="submit">Add Book</button>
    </form>

</div>

</body>
</html>
