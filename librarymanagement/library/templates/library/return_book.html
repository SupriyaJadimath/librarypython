
<!DOCTYPE html>
<html>
<head>
    <title>Return Books</title>

    <style>
        body {
            background: #f4f1fa;
            font-family: Arial;
        }

        h2 {
            text-align: center;
            color: #4b267d;
            margin-top: 30px;
        }

        table {
            width: 90%;
            margin: 30px auto;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background: #4b267d;
            color: white;
        }

        button {
            background: #4b267d;
            color: white;
            padding: 10px 18px;
            border: none;
            cursor: pointer;
        }

        a {
            color: #4b267d;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h2>📚 Return Books</h2>

<table>

    <tr>
        <th>Book Name</th>
        <th>Member Name</th>
        <th>Issue Date</th>
        <th>Action</th>
    </tr>

    {% for issue in issued_books %}

    <tr>
        <td>{{ issue.book.book_name }}</td>
        <td>{{ issue.member.name }}</td>
        <td>{{ issue.issue_date }}</td>

        <td>
            <form method="POST">
                {% csrf_token %}

                <input type="hidden"
                       name="issue_id"
                       value="{{ issue.id }}">

                <button type="submit">Return Book</button>
            </form>
        </td>
    </tr>

    {% empty %}

    <tr>
        <td colspan="4">No books to return!</td>
    </tr>

    {% endfor %}

</table>

<p style="text-align:center;">
    <a href="/">Back to Home</a>
</p>

</body>
</html>
