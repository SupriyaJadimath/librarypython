
<!DOCTYPE html>
<html>
<head>
    <title>View Books</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f1fa;
            margin: 0;
        }

        h2 {
            text-align: center;
            color: #4b267d;
            margin-top: 30px;
        }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background: #4b267d;
            color: white;
        }

        tr:hover {
            background: #eee7f8;
        }

        a {
            display: block;
            text-align: center;
            color: #4b267d;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h2>📚 Available Books</h2>

<form method="GET" style="text-align:center; margin:20px;">
    <input
        type="text"
        name="search"
        placeholder="Search by book name or author"
        value="{{ search|default:'' }}"
        style="padding:10px; width:250px;"
    >

    <button type="submit"
        style="padding:10px; background:#4b267d;
        color:white; border:none; cursor:pointer;">
        Search
    </button>

    <a href="{% url 'view_books' %}">Show All</a>
</form>


    <table>
        <tr>
            <th>Actions</th>
            <th>Book Name</th>
            <th>Author</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Price</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.book_name }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.category }}</td>
            <td>{{ book.quantity }}</td>
            <td>{{ book.price }}</td>
            <td>
    <a href="{% url 'edit_book' book.id %}">Edit</a>

    <a href="{% url 'delete_book' book.id %}"
       onclick="return confirm('Are you sure you want to delete this book?')">
        Delete
    </a>
</td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="5">No books available!</td>
        </tr>
        {% endfor %}

    </table>

    <a href="/">Back to Home</a>

</body>
</html>
