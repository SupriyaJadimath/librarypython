
<!DOCTYPE html>
<html>
<head>
    <title>View Members</title>

    <style>
        body {
            background: #f4f1fa;
            font-family: Arial;
        }

        h2 {
            text-align: center;
            color: #4b267d;
            margin-top: 30px;
        }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #4b267d;
            color: white;
        }

        a {
            color: #4b267d;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h2>👥 Registered Members</h2>

    <table>
        <tr>
            <th>Action</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
        </tr>

        {% for member in members %}
        <tr>
            <td>{{ member.name }}</td>
            <td>{{ member.email }}</td>
            <td>{{ member.phone }}</td>
            <td>{{ member.address }}</td>
            <td>
    <a href="{% url 'edit_member' member.id %}">Edit</a>
</td>

<form method="POST" action="{% url 'delete_member' member.id %}"
      style="display:inline;">
    {% csrf_token %}
    <button type="submit"
            onclick="return confirm('Are you sure you want to delete this member?');">
        Delete
    </button>
</form>

        </tr>

        {% empty %}
        <tr>
            <td colspan="4">No members registered yet!</td>
        </tr>
        {% endfor %}

    </table>

    <p style="text-align:center;">
        <a href="/">Back to Home</a>
    </p>

</body>
</html>
