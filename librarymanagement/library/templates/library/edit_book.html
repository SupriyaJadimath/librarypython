
<!DOCTYPE html>
<html>
<head>
    <title>Edit Book</title>
    <style>
        body {
            background: #f4f1fa;
            font-family: Arial;
        }

        .container {
            width: 400px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        h2 {
            color: #4b267d;
            text-align: center;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4b267d;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit Book</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="book_name"
        value="{{ book.book_name }}" required>

        <input type="text" name="author"
        value="{{ book.author }}" required>

        <input type="text" name="category"
        value="{{ book.category }}" required>

        <input type="number" name="quantity"
        value="{{ book.quantity }}" min="0" required>

        <input type="number" name="price"
        value="{{ book.price }}" min="0" required>

        <button type="submit">Update Book</button>
    </form>
</div>

</body>
</html>
